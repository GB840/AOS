name: CI

on:
  push:
    branches: [main, master, dev, "feature/**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全量 fetch，供 diff-aware lint 计算 merge-base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Static checks (ruff on changed files + AST duplicate scan)
        run: |
          base=$(git merge-base "origin/${{ github.event.pull_request.base.ref || 'master' }}" HEAD 2>/dev/null || git merge-base origin/master HEAD 2>/dev/null || echo HEAD~1)
          changed=$(git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- '*.py' || true)
          if [ -n "$changed" ]; then
            echo "Linting changed Python files (diff-aware):"
            echo "$changed"
            ruff check $changed
          else
            echo "No Python files changed in this PR. Skipping ruff."
          fi
          python scripts/check_ast_duplicates.py src

      - name: Database-layer smoke test (lightweight, no full AOS deps)
        continue-on-error: true  # 暴露 master 历史债(meta_orchestrator 重建版接口不匹配 + core.platform 依赖缺口)，不阻断合并，需专项清理
        run: make smoke

      - name: Unit tests (changed test files, diff-aware)
        run: |
          base=$(git merge-base "origin/${{ github.event.pull_request.base.ref || 'master' }}" HEAD 2>/dev/null || git merge-base origin/master HEAD 2>/dev/null || echo HEAD~1)
          changed_tests=$(git diff --name-only --diff-filter=ACMRT "$base"...HEAD | grep -E '^tests/.*\.py$' || true)
          if [ -n "$changed_tests" ]; then
            echo "Running changed test files (diff-aware):"
            echo "$changed_tests"
            python -m pytest $changed_tests -v --tb=short -m "not integration and not e2e"
          else
            echo "No test files changed in this PR."
          fi

      - name: Kernel integration test (zero-dependency, no API keys needed)
        run: |
          python -c "import sys; sys.path.insert(0,'src'); from kernel.system import build_default_system; s=build_default_system(); print('kernel OK')"
          python -m pytest tests/test_kernel.py -v --tb=short
