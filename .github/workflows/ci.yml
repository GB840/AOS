name: CI

on:
  push:
    branches: [main, master, dev, "feature/**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Static checks (ruff + AST duplicate definitions)
        run: make check

      - name: Database-layer smoke test (lightweight, no full AOS deps)
        run: make smoke

      - name: Unit tests
        run: make test

      - name: Kernel integration test (zero-dependency, no API keys needed)
        run: |
          python -c "import sys; sys.path.insert(0,'src'); from kernel.system import build_default_system; s=build_default_system(); print('kernel OK')"
          python -m pytest tests/test_kernel.py -v --tb=short
