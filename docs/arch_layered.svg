<svg viewBox="0 0 680 596" width="100%" role="img">
  <title>AOS open fabric layered architecture</title>
  <desc>User entry to AOS enhancement layer to open fabric thin seam (capability/registry/adapter/protocols) to 8 engines across behavior and infrastructure planes to real open-source base.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="32" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">AOS · 开放 Fabric 分层架构</text>
  <text x="40" y="52" font-family="sans-serif" font-size="12" fill="#444441">能力 → 薄缝(fabric) → 8 引擎 / 5 平面 → 真实开源基座</text>

  <rect x="40" y="72" width="600" height="48" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="101" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">用户 / 任务 入口</text>

  <rect x="40" y="146" width="600" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489">AOS 提升层：统一状态 · 进化治理 · 平台外壳 · Web 控制台</text>

  <rect x="40" y="222" width="600" height="92" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="56" y="242" font-family="sans-serif" font-size="12" font-weight="500" fill="#0C447C">开放 Fabric 薄缝（AOS 只拥有的接线板）</text>
  <rect x="60" y="252" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="125" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#042C53">capability</text>
  <text x="125" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">能力清单</text>
  <rect x="200" y="252" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="265" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#042C53">registry</text>
  <text x="265" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">路由 · 健康门控</text>
  <rect x="340" y="252" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="405" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#042C53">adapter</text>
  <text x="405" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">统一契约</text>
  <rect x="480" y="252" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="545" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#042C53">protocols</text>
  <text x="545" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">MCP/A2A/ACP</text>

  <rect x="40" y="338" width="600" height="72" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="56" y="358" font-family="sans-serif" font-size="12" font-weight="500" fill="#27500A">行为平面（3 器官 + AG2 群聊）</text>
  <rect x="60" y="366" width="130" height="36" rx="6" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="125" y="389" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#173404">OpenClaw · 接入</text>
  <rect x="200" y="366" width="130" height="36" rx="6" fill="#FFFFFF" stroke="#A11D40" stroke-width="0.5"/>
  <text x="265" y="389" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4A0A1E">AG2 · 群聊</text>
  <rect x="340" y="366" width="130" height="36" rx="6" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="405" y="389" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#173404">Hermes · 自进化</text>
  <rect x="480" y="366" width="130" height="36" rx="6" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="545" y="389" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#173404">DeerFlow · 长时</text>

  <rect x="40" y="432" width="600" height="72" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="56" y="452" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041">基础设施平面（4 真实开源）</text>
  <rect x="60" y="460" width="130" height="36" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="125" y="483" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#04342C">LiteLLM · 推理</text>
  <rect x="200" y="460" width="130" height="36" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="265" y="483" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#04342C">Mem0 · 记忆</text>
  <rect x="340" y="460" width="130" height="36" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="405" y="483" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#04342C">browser-use · ACI</text>
  <rect x="480" y="460" width="130" height="36" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="545" y="483" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#04342C">Langfuse · 观测</text>

  <rect x="40" y="526" width="600" height="50" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="556" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402">真实开源基座（MIT / GPL-3.0 / Apache）</text>

  <line x1="340" y1="120" x2="340" y2="146" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="198" x2="340" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="314" x2="340" y2="338" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="410" x2="340" y2="432" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="504" x2="340" y2="526" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
