syntax = "proto3";

package aos.meta;

// L3.5 元调度路由层：三项核心职责
service MetaOrchestrator {
  rpc RouteIntent (RouteIntentRequest) returns (RouteIntentResponse);
  rpc QueryPriority (QueryPriorityRequest) returns (QueryPriorityResponse);
  rpc InjectPersona (InjectPersonaRequest) returns (InjectPersonaResponse);
}

message RouteIntentRequest {
  string intent = 1;
  string user_id = 2;
  string project_id = 3;
  string trace_id = 4;
}

message RouteIntentResponse {
  string workflow_id = 1;
  int32 priority = 2;
  string persona_config = 3;  // JSON，透传
}

message QueryPriorityRequest {
  string task_id = 1;
}

message QueryPriorityResponse {
  int32 priority_level = 1;
}

message InjectPersonaRequest {
  string user_id = 1;
  string project_id = 2;
}

message InjectPersonaResponse {
  string persona_config = 1;  // JSON，含 extensions 预留字段
}