<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AOS · 一句话自主执行</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3340;
    --txt:#e6edf3; --dim:#8b949e; --accent:#3fb950; --accent2:#58a6ff;
    --warn:#f0883e; --bad:#f85149; --ok:#3fb950;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;padding:28px 16px 60px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent)}
  .sub{color:var(--dim);font-size:13px;margin:0 0 20px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  textarea{width:100%;min-height:76px;resize:vertical;background:var(--panel2);
    border:1px solid var(--line);border-radius:9px;color:var(--txt);
    padding:11px 12px;font-size:15px;font-family:inherit;outline:none}
  textarea:focus{border-color:var(--accent2)}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  button{cursor:pointer;border:none;border-radius:9px;padding:10px 18px;
    font-size:14px;font-weight:600;font-family:inherit}
  .run{background:var(--accent);color:#06210d}
  .run:disabled{opacity:.5;cursor:not-allowed}
  .mic{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .mic.on{background:var(--bad);color:#fff}
  .hint{color:var(--dim);font-size:12px;margin-left:auto;align-self:center}
  .phase{margin:18px 0 6px;font-size:13px;color:var(--accent2);
    min-height:20px;display:flex;align-items:center;gap:8px}
  .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent2);
    border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sec{margin-top:18px}
  .sec h3{font-size:13px;color:var(--dim);margin:0 0 8px;font-weight:600;
    text-transform:uppercase;letter-spacing:.06em}
  .plan{white-space:pre-wrap;font-size:13px;color:var(--txt);
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px}
  .step{display:flex;gap:10px;padding:9px 12px;border:1px solid var(--line);
    border-radius:9px;margin-bottom:8px;background:var(--panel2);align-items:flex-start}
  .step .ic{flex:0 0 22px;text-align:center;font-weight:700}
  .step .body{flex:1;min-width:0}
  .step .cap{font-weight:600;font-size:14px}
  .step .sum{color:var(--dim);font-size:12px;margin-top:2px;word-break:break-word}
  .ok{border-color:#1d3a26}.ok .ic{color:var(--ok)}
  .bad{border-color:#4a2522}.bad .ic{color:var(--bad)}
  .pend{border-color:var(--line);opacity:.6}
  .final{white-space:pre-wrap;font-size:14px;background:var(--panel2);
    border:1px solid var(--accent);border-radius:9px;padding:14px}
  .meta{color:var(--dim);font-size:12px;margin-top:14px;word-break:break-all}
  .meta code{color:var(--accent2)}
  .err{color:var(--bad);font-size:13px;margin-top:10px}
  .reflect{font-size:12px;color:var(--warn);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span> AOS · 一句话自主执行</h1>
  <p class="sub">说一句（或打一句），它自己规划 → 执行 → 反思 → 出结果。你什么都不用配。</p>

  <div class="box">
    <textarea id="task" placeholder="例如：搜索 2026 年开源大模型最新进展，并总结成 5 条要点"></textarea>
    <div class="row">
      <button class="run" id="runBtn">▶ 执行</button>
      <button class="mic" id="micBtn" title="语音输入（建议用 Chrome）">🎤 语音</button>
      <span class="hint">后端：智谱直连 · 无需 ag2/ollama</span>
    </div>
  </div>

  <div class="phase" id="phase"></div>

  <div id="content"></div>

  <div class="meta" id="meta"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const runBtn = $('runBtn'), micBtn = $('micBtn'), taskEl = $('task');
const phaseEl = $('phase'), contentEl = $('content'), metaEl = $('meta');

let pollTimer = null;

function setPhase(txt, spin){
  phaseEl.innerHTML = (spin ? '<span class="spin"></span>' : '') + (txt||'');
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderState(st){
  const last = (st && st.last) || {};
  const plan = last.plan || (st && st.plan_text) || '';
  const exe  = last.execution || {};
  const trace = exe.trace || [];
  const cycle = (st && st.cycle!=null) ? st.cycle : -1;

  let html = '';
  if(plan){
    html += '<div class="sec"><h3>规划（'+esc(last.planner||'')+'）</h3><div class="plan">'+esc(plan)+'</div></div>';
  }
  if(trace.length){
    html += '<div class="sec"><h3>执行步骤 · 第 '+(cycle+1)+' 轮</h3>';
    trace.forEach((t,i)=>{
      const ok = t.ok, real = t.real;
      const cls = ok ? 'ok' : (ok===false ? 'bad' : 'pend');
      const ic  = ok ? '✓' : (ok===false ? '✗' : '·');
      const tag = real===true ? ' <span style="color:var(--accent)">真实</span>'
                : real===false ? ' <span style="color:var(--bad)">失败/模拟</span>' : '';
      html += '<div class="step '+cls+'"><div class="ic">'+ic+'</div>'
            + '<div class="body"><div class="cap">'+esc(t.capability||('步骤'+(i+1)))+tag+'</div>'
            + (t.summary ? '<div class="sum">'+esc(t.summary)+'</div>' : '')
            + '</div></div>';
    });
    html += '</div>';
  }
  if(exe.final){
    html += '<div class="sec"><h3>最终结果</h3><div class="final">'+esc(exe.final)+'</div></div>';
  }
  if(last.reflection && last.reflection.log && last.reflection.log.length){
    const r = last.reflection;
    html += '<div class="sec"><h3>反思闭环</h3>';
    html += '<div class="reflect">共执行 '+esc(r.attempts)+' 轮'
          + (r.exhausted?' · 已达上限未完全达成':' · 已达成')+'</div>';
    r.log.slice(-4).forEach(x=>{
      html += '<div class="reflect">· '+(x.action||'')+'：'+esc(x.reason||'')+'</div>';
    });
    html += '</div>';
  }
  contentEl.innerHTML = html;

  if(last.trace_id) metaEl.innerHTML = 'run_id: <code>'+esc(st.run_id||'')+'</code> · trace_id: <code>'+esc(last.trace_id)+'</code> · 耗时 '+esc(last.duration_s||'')+'s';
}

async function poll(runId){
  setPhase('正在执行，请稍候…', true);
  pollTimer = setInterval(async ()=>{
    try{
      const r = await fetch('/api/autopilot/status/'+encodeURIComponent(runId));
      const j = await r.json();
      const st = j.state || {};
      if(j.status === 'done'){
        clearInterval(pollTimer);
        renderState(st);
        setPhase('✅ 完成', false);
        runBtn.disabled = false;
        if(st.last && st.last.error){ metaEl.innerHTML += '<div class="err">错误：'+esc(st.last.error)+'</div>'; }
        return;
      }
      if(j.status === 'starting'){ setPhase('正在启动任务…', true); return; }
      renderState(st);
      const cyc = (st.cycle!=null?st.cycle:-1);
      setPhase('自主环运行中 · 第 '+(cyc+1)+' 轮', true);
    }catch(e){
      setPhase('轮询状态出错：'+e.message, false);
    }
  }, 1200);
}

async function start(){
  const task = taskEl.value.trim();
  if(!task){ alert('先说/打一句你要它做什么'); return; }
  runBtn.disabled = true;
  contentEl.innerHTML = ''; metaEl.innerHTML = '';
  setPhase('提交任务中…', true);
  try{
    const r = await fetch('/api/autopilot/run',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({task:task, planner:'zhipu'})
    });
    const j = await r.json();
    if(!j.ok){ throw new Error(j.detail||'提交失败'); }
    poll(j.run_id);
  }catch(e){
    setPhase('', false);
    metaEl.innerHTML = '<div class="err">'+esc(e.message)+'</div>';
    runBtn.disabled = false;
  }
}

runBtn.onclick = start;
taskEl.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && e.key==='Enter') start(); });

// ---- 语音输入（浏览器端 Web Speech API，本地识别，无需服务端）----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  const rec = new SR();
  rec.lang = 'zh-CN'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e=>{ taskEl.value = e.results[0][0].transcript; };
  rec.onerror = e=>{ micBtn.classList.remove('on'); setPhase('语音识别出错：'+e.error, false); };
  rec.onend = ()=> micBtn.classList.remove('on');
  micBtn.onclick = ()=>{
    if(micBtn.classList.contains('on')){ rec.stop(); return; }
    try{ rec.start(); micBtn.classList.add('on'); setPhase('🎤 听写中…说完自动填入', true); }
    catch(e){ setPhase('无法启动语音：'+e.message, false); }
  };
}else{
  micBtn.disabled = true; micBtn.title = '当前浏览器不支持语音，请用 Chrome 或直接在框里打字';
}
</script>
</body>
</html>
