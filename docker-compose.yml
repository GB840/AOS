version: '3.8'

services:
  aos:
    build: .
    container_name: aos
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONPATH=/app/src
      - AOS_MEM0_LOCAL=1
    volumes:
      - ./data:/app/data
    working_dir: /app
    stdin_open: true
    tty: true
