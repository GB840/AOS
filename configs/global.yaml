deploy_mode: standalone  # 由 detect_env.sh 动态写入

# 服务连接信息（这些与 docker-compose 服务名一致）
services:
  postgres:
    host: postgres
    port: 5432
    user: agentos
    password: agentos_secret
    db: agent_os
    audit_db: agent_audit
  redis:
    host: redis
    port: 6379
    password: redis_secret
  temporal:
    host: temporal
    port: 7233



# AOS Skills System (7 self-evolving skills)
skills:
  enabled: true
  auto_evolve: true
  output_dir: outputs/skills
  categories:
    autonomous-ai-agents:
      - skill-creator
      - find-skills
      - superpowers
      - j-stack
    creative:
      - frontend-design
      - ui-ux-pro-max
    research:
      - duckduckgo-search



# ==================== 开源框架路径配置 ====================
# Hermes Agent v0.15.2 (NousResearch, MIT) -- 大脑
# 路径可通过环境变量 HERMES_SOURCE_PATH / HERMES_AGENT_PATH 覆盖
hermes:
  source_path: "${HERMES_SOURCE_PATH:external/hermes-agent}"
  agent_path: "${HERMES_AGENT_PATH:external/hermes_agent}"
  version: "0.15.2"
  license: MIT
  role: brain

# DeerFlow 2.0 (ByteDance, open-source) -- 编排引擎
# 路径可通过环境变量 DEERFLOW_SOURCE_PATH / DEERFLOW_HARNESS_PATH 覆盖
deerflow:
  source_path: "${DEERFLOW_SOURCE_PATH:external/deer-flow/backend}"
  harness_path: "${DEERFLOW_HARNESS_PATH:external/deer-flow/backend/packages/harness}"
  config_path: "${DEERFLOW_CONFIG_PATH:external/deer-flow/config.example.yaml}"
  version: "2.0"
  license: open-source
  role: scheduler

# 子智能体配置
subagents:
  timeout_seconds: 600
  agents:
    openclaw:
      enabled: true
      description: "OpenClaw — 浏览器自动化、代码生成、团队协作"
      source_path: "${OPENCLAW_CWD:external/jiuwenclaw}"
      command: "${OPENCLAW_COMMAND:npx}"
      capabilities:
        - browser_automation
        - code_generation
        - code_review
        - web_search
        - team_collaboration
    uitars:
      enabled: true
      description: "UI-TARS — GUI桌面自动化、截屏识别"
      source_path: "${UITARS_CWD:external/UI-TARS-desktop}"
      use_mcp: "${UITARS_USE_MCP:false}"
      mcp_port: "${UITARS_MCP_PORT:8090}"
      capabilities:
        - gui_automation
        - screen_capture
        - mouse_keyboard_control
    lobster:
      enabled: true
      description: "LobsterAI — 办公自动化、文档处理"
      source_path: "${LOBSTER_PATH:external/lobster}"
      mode: "${LOBSTER_MODE:openclaw_bridge}"
      port: "${LOBSTER_PORT:8091}"
      capabilities:
        - document_processing
        - data_analysis
        - presentation_creation
        - browser_automation
