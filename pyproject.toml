[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aos-kernel"
version = "1.0.0"
description = "AOS Kernel — Agentic OS minimal kernel with species thinking (immunity/evolution/ecology) and Hippo-Scroll trusted memory"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AOS Team"}]
keywords = ["agent", "ai", "agentic-os", "species-thinking", "self-evolving", "memory", "trusted-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
# 统一依赖声明：pyproject.toml 是唯一真相。
# 旧的 requirements.txt 已废弃，由 `uv pip compile` 按需生成锁文件。
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    # 注：langgraph / langchain-core / crewai 已于 2026-08-08 从必装移入
    # 可选组 [orchestration]，原因见下方 optional-dependencies 处的说明。
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "requests>=2.30.0",
    # ── LLM 平面真实依赖（src/router/llm_router.py / litellm_adapter.py 直接 import）──
    "openai>=1.30.0",
    "litellm>=1.40.0",
    "cryptography>=42.0.0",
    "websocket-client>=1.7.0",
    "aiohttp>=3.9.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.16",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    # ── 以下 5 项此前漏声明，但代码模块顶层直接 import，缺了服务根本起不来 ──
    # （2026-08-04 用 AST 扫描 src/ 全部顶层 import 与本文件对账后补齐）
    "pydantic-settings>=2.0.0",   # src/utils/config.py 顶层 import，缺失则配置层直接崩
    "starlette>=0.37.0",          # src/api/main.py & security.py 直接用其中间件基类
    "bcrypt>=4.0.0",              # src/api/security.py 顶层 import，API Key 哈希校验
    "PyJWT[crypto]>=2.8.0",       # 团队级 JWT 认证（RS256 需要 crypto extra）
    "aiosqlite>=0.19.0",          # src/core/pool/connection_pool.py 顶层 import
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout>=2.0", "bandit>=1.7.0", "safety>=3.0.0", "ruff>=0.1.0", "mypy>=1.8.0"]
test = ["pytest>=7.0", "pytest-timeout>=2.0"]
# 前端控制台（src/web/app.py 直接 import streamlit + pandas）。
web = ["streamlit>=1.30.0", "pandas>=2.0.0"]
# 仅 LLM 相关依赖（不含 web）。
llm = ["openai>=1.30.0", "litellm>=1.40.0", "websocket-client>=1.7.0"]
# 安全扫描工具
security = ["bandit>=1.7.0", "safety>=3.0.0"]
# 第三方编排框架（可选增强，2026-08-08 从必装 dependencies 移出）。
#
# 移出依据（真机实证，非推断）：本机 venv 从未安装这三个包，而
#   - api.main 正常启动，/openapi.json 输出 292 条路由；
#   - 端到端租户链路（注册 → 拿 key → 设目标 → 状态回读）全程跑通。
# 说明 AOS 核心（FabricHub / autopilot 自主环 / Playbook 工作流）压根不需要它们。
# 把可选增强钉成必装，等于逼每个想跑 AOS 的人先吞下一整套重型框架及其传递依赖，
# 直接违反母纲原则 3「完整开源·一键安装」与原则 7「技术普惠·8G 旧电脑能跑」。
#
# 依赖它们的两个包（kernel.danchuang.integrations / kernel.danchuang.llm）
# 已改为 PEP 562 惰性导入：不装时轻量符号照常可用，访问重符号才报错，
# 且错误信息里直接给出 `pip install -e ".[orchestration]"`。
orchestration = ["langgraph>=1.0.0", "langchain-core>=1.0.0", "crewai>=1.0.0"]
# 分布式工作流（src/deerflow/echo_workflow.py），未启用 DeerFlow 时无需安装。
workflow = ["temporalio>=1.5.0"]
# gRPC 控制面（src/common/*_pb2*.py），未启用多租户控制面时无需安装。
grpc = ["grpcio>=1.60.0", "protobuf>=4.25.0"]

[project.scripts]
aos = "scripts.aos:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
timeout_method = "thread"

[project.urls]
Homepage = "https://github.com/aos-dev/aos-kernel"
Repository = "https://github.com/aos-dev/aos-kernel"

[tool.setuptools.packages.find]
where = ["src", "scripts"]

[tool.bandit]
exclude_dirs = ["tests", ".git", "__pycache__", ".venv", "venv", "env"]
skips = ["B101", "B601", "B602", "B105", "B310", "B307", "B110", "B404", "B603", "B607", "B311", "B107", "B112"]
severity_level = "medium"
confidence_level = "medium"

[tool.safety]
ignore = ["70612"]  # 忽略某些已知的误报
full-report = true
continue-on-error = true

# =============================================================================
# ruff 配置：只启用「真问题」规则集，避免全仓库历史风格债（UP/BLE/DTZ/N/SIM…）
# 连坐 CI。F=pyflakes(未用导入/未定义名/未用变量 真 bug)；E9=语法错误。
# 风格类（PEP585/604、盲 except、时区、命名等）属渐进清理范畴，不在 CI 卡死。
# CI 的 Static checks 进一步只对「本 PR 增量文件」做 diff-aware 校验（见 ci.yml）。
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]
