[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "aos"
version = "5.0.0"
description = "AOS v5.0 -- Agent Operating System powered by Hermes + DeerFlow"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AOS Team", email = "aos@example.com" },
]
keywords = [
    "ai-agent", "agent-operating-system", "hermes-agent", "deerflow",
    "multi-agent", "orchestration", "llm", "langgraph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Artificial Intelligence",
]

dependencies = [
    # Core web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",

    # LLM / API clients
    "openai>=1.12.0",
    "requests>=2.31.0",
    "websocket-client>=1.7.0",
    "httpx>=0.27.0",

    # Database & vector stores
    "chromadb>=0.4.22",
    "sqlmodel>=0.0.16",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=5.3.0",
    "jina>=3.26.0",

    # UI
    "streamlit>=1.30.0",
    "streamlit-webrtc>=0.45.0",
    "plotly>=5.18.0",

    # LangGraph ecosystem
    "langgraph>=0.0.20",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.0",

    # Utilities
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "hatch>=1.9.0",
]
gpu = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "sentence-transformers>=2.2.0",
]
voice = [
    "pyaudio>=0.2.14",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
]
video = [
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.0",
]
all = [
    "aos[dev,gpu,voice,video]",
]

[project.scripts]
aos = "src.cli:main"
aos-api = "src.api.main:main"
aos-web = "src.web.app:main"

[project.urls]
Homepage = "https://github.com/aos-team/aos"
Documentation = "https://aos.readthedocs.io"
Repository = "https://github.com/aos-team/aos"
Changelog = "https://github.com/aos-team/aos/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/configs",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/distutils/*",
    "*/hermes/*",
    "*/deer-flow/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"
fix = true
show-fixes = true
output-format = "full"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "ASYNC", # flake8-async
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PERF", # perflint
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "ARG001", # unused function arguments (too strict for this codebase)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "PERF203", # break in try-except block affects performance
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["F401", "F811"]
"*/migrations/*" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
pretty = true
strict_equality = true
