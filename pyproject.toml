[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aos-kernel"
version = "1.0.0"
description = "AOS Kernel — Agentic OS minimal kernel with species thinking (immunity/evolution/ecology) and Hippo-Scroll trusted memory"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AOS Team"}]
keywords = ["agent", "ai", "agentic-os", "species-thinking", "self-evolving", "memory", "trusted-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
# 注意: 本 pyproject 仅描述「aos-kernel 最小内核」打包(物种思维/可信记忆等核心模块,
# stdlib-only 可独立 import)。AOS 完整运行时(FastAPI 网关 / MCP / 多智能体 / 记忆后端等)
# 的重依赖见仓库根 requirements.txt, 由 Dockerfile / Makefile `install` 安装, 不在此列。
# 二者分工: pyproject = 内核可分发构件; requirements.txt = 完整可运行系统的依赖真相。
dependencies = []  # Zero heavy dependencies — stdlib only (见 requirements.txt 获取完整运行时)

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
test = ["pytest>=7.0"]

[project.scripts]
aos = "scripts.aos:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/aos-dev/aos-kernel"
Repository = "https://github.com/aos-dev/aos-kernel"

[tool.setuptools.packages.find]
where = ["src"]
