[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aos-kernel"
version = "1.0.0"
description = "AOS Kernel — Agentic OS minimal kernel with species thinking (immunity/evolution/ecology) and Hippo-Scroll trusted memory"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AOS Team"}]
keywords = ["agent", "ai", "agentic-os", "species-thinking", "self-evolving", "memory", "trusted-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
# 统一依赖声明：pyproject.toml 是唯一真相。
# 旧的 requirements.txt 已废弃，由 `uv pip compile` 按需生成锁文件。
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "crewai>=1.0.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "requests>=2.30.0",
    # ── LLM 平面真实依赖（src/router/llm_router.py / litellm_adapter.py 直接 import）──
    "openai>=1.30.0",
    "litellm>=1.40.0",
    "cryptography>=42.0.0",
    "websocket-client>=1.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout>=2.0"]
test = ["pytest>=7.0", "pytest-timeout>=2.0"]
# 前端控制台（src/web/app.py 直接 import streamlit）。
web = ["streamlit>=1.30.0"]
# 仅 LLM 相关依赖（不含 web）。
llm = ["openai>=1.30.0", "litellm>=1.40.0", "websocket-client>=1.7.0"]

[project.scripts]
aos = "scripts.aos:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
timeout_method = "thread"

[project.urls]
Homepage = "https://github.com/aos-dev/aos-kernel"
Repository = "https://github.com/aos-dev/aos-kernel"

[tool.setuptools.packages.find]
where = ["src"]
